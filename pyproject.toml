[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-rag"
version = "0.1.0"
description = "RAG sobre o Código de Defesa do Consumidor com citação dos artigos e avaliação da busca"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arthur Penedo" }]
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cdc-rag = "cdc_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdc_rag = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
